<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: cabin switch up top, then best picks and one filterable fare table for the chosen cabin */
:root {
  --bg: #d6cab6; --surface: #f4efe7; --fg: #3b3128; --muted: #6e6254; --line: #bfb29b;
  --accent: #8c6a3f; --accent-soft: #e8dcc6; --on-accent: #ffffff; --good: #5a6b45; --good-soft: #e0e4d0;
  --warn: #8a5a2b; --warn-soft: #f0e0c8; --over: #a14a35;
  --display: "Roboto", "Segoe UI", system-ui, sans-serif;
  --body: "Roboto", "Segoe UI", system-ui, sans-serif;
  --mono: "Roboto Mono", ui-monospace, Consolas, monospace;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; }
.wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 32px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 5.5vw, 48px); line-height: 1.1; font-weight: 300; }
h2 { font-size: 24px; font-weight: 300; }
p { margin: 0; }
header { display: grid; gap: 14px; }
.lede { color: var(--muted); max-width: 70ch; }
.criteria { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); }
section { display: grid; gap: 14px; }
.section-note { color: var(--muted); max-width: 74ch; }

.cabin { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); justify-self: start; }
.cabin button { font: 600 15px var(--body); color: var(--muted); background: none; border: 0; border-radius: 9px; padding: 9px 18px; cursor: pointer; }
.cabin button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.cabin button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.pick { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.pick .tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.pick .route { font-family: var(--mono); font-size: 19px; }
.pick .price { font-family: var(--display); font-size: 32px; font-weight: 300; line-height: 1; }
.pick .meta { color: var(--muted); font-size: 13.5px; }
.pick a { font-size: 13.5px; color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 13.5px var(--body); color: var(--muted); background: none; border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button:focus-visible, .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.count { margin-left: auto; color: var(--muted); font-size: 13px; }

.table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 780px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
tr:last-child td { border-bottom: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.amt, th.amt { text-align: right; }
td.amt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15.5px; }
.sub { color: var(--muted); font-size: 13px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.full { background: var(--good-soft); color: var(--good); }
.mixed { background: var(--warn-soft); color: var(--warn); }
.eco { background: var(--accent-soft); color: var(--accent); }
.s0 { background: var(--good-soft); color: var(--good); }
.s1 { background: var(--accent-soft); color: var(--accent); }
.s2 { background: var(--warn-soft); color: var(--warn); }
.long { color: var(--warn); font-size: 12.5px; }
.overby { color: var(--over); font-size: 12.5px; }
td a { color: var(--accent); font-size: 13px; white-space: nowrap; }
.empty { color: var(--muted); }

.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.notes ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); max-width: 80ch; }
.notes strong { color: var(--fg); }
</style>

.selectors { display: flex; flex-wrap: wrap; gap: 12px 24px; }
.sel { display: grid; gap: 4px; max-width: 100%; }
.sel-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cabin { flex-wrap: wrap; max-width: 100%; }

.lv-t { background: #d3dde2; color: #26404d; border-color: #a3b7c1; }

.flag { width: 21px; height: 14px; vertical-align: -2px; border: 1px solid var(--line); border-radius: 2px; margin-right: 2px; }

<script>
const SEASONS = {

    b: { label: "Dec 20 – Dec 31", days: 11, d: "2026-12-20", r: "2026-12-31" },
    c: { label: "Dec 22 – Jan 2", days: 11, d: "2026-12-22", r: "2027-01-02" } } },
  spring: { name: "Spring", chips: ["Leave after Mar 18", "Return before Mar 28", "6+ days"], D: {

    d: { label: "Jul 20 – Aug 2", days: 13, d: "2027-07-20", r: "2027-08-02" } } }
};
const CAB = {
  eco: { name: "economy", code: 1, hash: "economy" },
  pe: { name: "premium economy", code: 2, hash: "premium" },
  bus: { name: "business", code: 3, hash: "business" }
};
const DEST = {
  TYO: ["Tokyo", "Japan", "/m/07dfk"], HND: ["Tokyo Haneda", "Japan", "/m/07dfk"], NRT: ["Tokyo Narita", "Japan", "/m/07dfk"],
  KIX: ["Osaka", "Japan", "KIX"], ICN: ["Seoul", "Korea", "ICN"]
};

// Google Flights link with the right cabin already selected (1 = economy, 2 = premium economy, 3 = business)
const enc = s => [...new TextEncoder().encode(s)];
const fld = (tag, b) => [tag, b.length, ...b];
const place = c => c.startsWith("/m/") ? [8, 2, ...fld(0x12, enc(c))] : [8, 1, ...fld(0x12, enc(c))];
const leg = (d, f, t) => fld(0x1a, [...fld(0x12, enc(d)), ...fld(0x6a, place(f)), ...fld(0x72, place(t))]);
function link(f, cabin, season) {
  const d = SEASONS[season].D[f.dk], to = DEST[f.to][2];
  const tail = [0x40, 1, 0x48, CAB[cabin].code, 0x70, 1, 0x82, 1, 0x0b, 0x08, 255, 255, 255, 255, 255, 255, 255, 255, 255, 1, 0x98, 1, 1];
  const b = [8, 0x1c, 0x10, 2, ...leg(d.d, f.from, to), ...leg(d.r, to, f.from), ...tail];
  return "https://www.google.com/travel/flights/search?tfs=" + btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") + "&hl=en&curr=USD";
}
const row = ([dk, from, to, airline, stops, via, time, dur, price, full = true]) => ({ dk, from, to, airline, stops, via, time, dur, price, full, country: DEST[to][1] });

// Same columns, plus whether every flight is premium economy
const PE = [

      note: "Full premium economy starts at $2,084 to Seoul (Air Premia nonstop) and $2,350 to Tokyo (Cathay Pacific via Hong Kong). All of it is under budget.",
      picks: [["Cheapest full premium economy to Seoul", 2084, "ICN", "LAX", "Air Premia nonstop, Jul 6 – 16"], ["Cheapest full premium economy to Tokyo", 2350, "TYO", "LAX", "Cathay Pacific via Hong Kong, Jul 20 – Aug 2"], ["Best nonstop to Tokyo", 2517, "TYO", "LAX", "JAL, Jun 1 – 11. Premium economy on every flight"], ["Best nonstop to Osaka", 2661, "KIX", "LAX", "United, Jun 1 – 11"]],
      notes: [
        "<strong>“Part economy” fares</strong> have at least one flight in plain economy. The cheapest, $2,023 to Tokyo on Air Canada and Philippine Airlines via Vancouver and Manila, is one of them.",
        BUDGET_NOTE,
        "<strong>All dates are close.</strong> Premium economy nonstops to Tokyo are $2,517 – $2,718 on every date pair.",
        "<strong>Non-LAX airports</strong> had no fare that was premium economy the whole way, except JAL SAN → Narita nonstop for $2,936.",
        "<strong>Searched:</strong> " + COVER.std + " Non-LAX airports were searched for Jul 20 – Aug 2."
      ]
    },
    bus: {
      rows: SUMMER_BUS,
      note: "ZIPAIR nonstop business to Tokyo is under budget on all four date pairs, from $3,492. Everything else is over $4,000.",
      picks: [["Cheapest business to Tokyo", 3492, "TYO", "LAX", "ZIPAIR nonstop, Jul 20 – Aug 2"], ["Next cheapest date", 3832, "TYO", "LAX", "ZIPAIR nonstop, Jul 6 – 16"], ["Cheapest to Seoul", 4618, "ICN", "LAX", "Philippine Airlines via Manila. $618 over budget"], ["Cheapest to Osaka", 4642, "KIX", "LAX", "Philippine Airlines via Manila. $642 over budget"]],
      notes: [
        BUDGET_NOTE,
        "<strong>ZIPAIR is a low-cost airline.</strong> Its business seats are flat beds, but meals, baggage and seat choice may cost extra, and it only flies LAX → Tokyo Narita.",
        "<strong>Full-service nonstops to Tokyo</strong> (ANA, United, JAL, American) cost $6,468 – $7,904.",
        "<strong>Seoul and Osaka</strong> start at about $4,600 – $4,700 on Philippine Airlines via Manila. Asiana via Seoul is $4,978 – $5,123.",
        "<strong>Searched:</strong> " + COVER.busLight + " SAN, SNA and ONT to Tokyo and SAN to Seoul for Jul 20 – Aug 2 were all $5,383 or more."
      ]
    }
  }
};

// Google Flights price tracker label for each route and date pair (l = low, t = typical, h = high), last read Nov 3, 2026 for the routes searched.
// Google shows no label for premium economy. Keys are FROM + TO + date pair (Tokyo airports count as TYO).
const TRACK = {
  "winter-eco": { def: "h" },
  "spring-eco": { def: "t" },
  "summer-eco": { def: "t", l: "LAXTYOa LAXKIXa LAXICNa LAXTYOb LAXKIXb LAXICNb" },
  "winter-bus": { h: "LAXTYOa LAXKIXa LAXICNa LAXTYOc LAXKIXc LAXICNc LAXICNb SANTYOb", t: "SANICNb LAXTYOb LAXKIXb" },
  "spring-bus": { l: "LAXKIXb LAXKIXc LAXKIXa", t: "LAXTYOb LAXTYOc LAXTYOa LAXICNa SNATYOa", h: "LAXICNb LAXICNc SANTYOa" },
  "summer-bus": { l: "LAXTYOa LAXTYOb", h: "LAXICNa LAXKIXc LAXICNc ONTTYOd", def: "t" }
};
function level(f) {
  const T = TRACK[state.season + "-" + state.cabin]; if (!T) return "";
  const k = f.from + (f.to === "HND" || f.to === "NRT" ? "TYO" : f.to) + f.dk;
  for (const s of ["l", "t", "h"]) if (T[s] && T[s].split(" ").includes(k)) return s;
  return T.def || "";
}
const LV = { l: "low", t: "typical", h: "high" };
const priceBox = f => { const v = level(f); return v ? `<span class="lv lv-${v}" title="Google says prices for this route and these dates are ${LV[v]}">${money(f.price)}</span>` : money(f.price); };

const money = n => "$" + n.toLocaleString("en-US");
// Country flag drawn in the page (flag emoji show as letters on Windows)
const flag = to => DEST[to][1] === "Korea" ? '<svg class="flag" viewBox="0 0 30 20" role="img" aria-label="South Korea"><use href="#f-kr"/></svg>' : '<svg class="flag" viewBox="0 0 30 20" role="img" aria-label="Japan"><use href="#f-jp"/></svg>';
const stopLabel = s => s === 0 ? "Nonstop" : s === 1 ? "1 stop" : "2 stops";
const hours = s => parseInt(s, 10);
const HASHC = { economy: "eco", premium: "pe", business: "bus" };

const state = { season: "winter", cabin: "eco", dest: "all", from: "all", nonstop: false, full: false, budget: true };
function readHash() {
  const [s, c] = location.hash.slice(1).toLowerCase().split("-");
  if (s === "economy" || s === "premium" || s === "business") { state.season = "winter"; state.cabin = HASHC[s]; return true; }
  if (!SEASONS[s]) return false;
  state.season = s; if (HASHC[c]) state.cabin = HASHC[c];
  return true;
}
if (!readHash()) {
  try {
    const s = localStorage.getItem("season"), c = localStorage.getItem("cabin");
    if (SEASONS[s]) state.season = s;
    if (CAB[c]) state.cabin = c;
  } catch (e) {}
}

function renderAll() {
  const S = SEASONS[state.season], C = DATA[state.season][state.cabin], cab = CAB[state.cabin];
  document.querySelectorAll("#f-season button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.season));
  document.querySelectorAll("#f-cabin button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.cabin));
  document.getElementById("h1").textContent = S.name + " " + cab.name + " to Japan & Korea";
  document.title = "Fares to Japan & Korea";
  document.getElementById("lede").textContent = "Round-trip " + cab.name + " fares from Southern California, found on Google Flights on Nov 3, 2026. Prices are per person for 1 adult and include taxes. They change often.";
  document.getElementById("chips").innerHTML = S.chips.map(t => `<span class="chip">${t}</span>`).join("") + ["LAX · SAN · SNA · ONT", "Under $4,000"].map(t => `<span class="chip">${t}</span>`).join("");
  document.getElementById("picks-note").textContent = C.note;
  document.getElementById("full-wrap").hidden = state.cabin === "eco";
  document.getElementById("full-label").textContent = state.cabin === "bus" ? "Business the whole way" : "Premium economy the whole way";
  document.getElementById("legend").innerHTML = TRACK[state.season + "-" + state.cabin]
    ? 'Price color is Google\'s price tracker for that route and those dates: <span class="lv lv-l">low</span> <span class="lv lv-t">typical</span> <span class="lv lv-h">high</span>'
    : "Google doesn't show its low / typical / high price tracker for premium economy, so these prices aren't color coded.";
  document.getElementById("notes").innerHTML =C.notes.map(n => `<li>${n}</li>`).join("");
  document.getElementById("picks").innerHTML = C.picks.map(([tag, p, to, from = "LAX", note]) => {
    const f = C.rows.find(r => r.price === p && r.to === to && r.from === from);
    if (!f) return "";
    return `
    <div class="pick">
      <span class="tag">${tag}</span>
      <span class="route">${flag(f.to)} ${f.from} → ${f.to}</span>
      <span class="price">${priceBox(f)}</span>
      <span class="meta">${f.airline} · ${stopLabel(f.stops)}${f.via ? " via " + f.via : ""} · ${f.dur}<br>${S.D[f.dk].label} (${S.D[f.dk].days} days)${note ? "<br>" + note : ""}</span>
      <a href="${link(f, state.cabin, state.season)}" target="_blank" rel="noopener">Open in Google Flights</a>
    </div>`;
  }).join("");
  render();
}

function cabinPill(f) {
  if (state.cabin === "eco") return '<span class="pill eco">Economy</span>';
  return f.full ? `<span class="pill full">${state.cabin === "bus" ? "Business" : "Premium economy"}</span>` : '<span class="pill mixed">Part economy</span>';
}

function render() {
  const S = SEASONS[state.season];
  const rows = DATA[state.season][state.cabin].rows.filter(f =>
    (state.dest === "all" || f.country === state.dest) &&
    (state.from === "all" || f.from === state.from) &&
    (!state.nonstop || f.stops === 0) &&
    (state.cabin === "eco" || !state.full || f.full) &&
    (!state.budget || f.price < 4000)
  ).sort((a, b) => a.price - b.price);
  document.getElementById("count").textContent = rows.length + (rows.length === 1 ? " fare" : " fares");
  const empty = state.budget ? "Nothing under $4,000 matches these filters. Turn off “Under $4,000” to see the cheapest fares that were found." : "No fares match these filters. Try turning off a filter, or switch cabins.";
  document.getElementById("rows").innerHTML = rows.length ? rows.map(f => `
    <tr>
      <td>${S.D[f.dk].label}<div class="sub">${S.D[f.dk].days} days</div></td>
      <td class="mono">${f.from} → ${f.to}<div class="sub">${flag(f.to)} ${DEST[f.to][0]}</div></td>
      <td>${f.airline}</td>
      <td><span class="pill s${f.stops}">${stopLabel(f.stops)}</span>${f.via ? `<div class="sub">via ${f.via}</div>` : ""}</td>
      <td class="mono">${f.time}<div class="sub">${f.dur}${hours(f.dur) >= 24 ? ' <span class="long">long trip</span>' : ""}</div></td>
      <td>${cabinPill(f)}</td>
      <td class="amt">${priceBox(f)}${f.price >= 4000 ? '<div class="overby">over budget</div>' : ""}</td>
      <td><a href="${link(f, state.cabin, state.season)}" target="_blank" rel="noopener">Search</a></td>
    </tr>`).join("") : `<tr><td colspan="8" class="empty">${empty}</td></tr>`;
}

function saveChoice() {
  try { localStorage.setItem("season", state.season); localStorage.setItem("cabin", state.cabin); } catch (e) {}
  try { history.replaceState(null, "", "#" + state.season + "-" + CAB[state.cabin].hash); } catch (e) {}
}
function seg(id, key, after) {
  const g = document.getElementById(id);
  g.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    state[key] = b.dataset.v; (after || render)();
  });
}
seg("f-season", "season", () => { saveChoice(); renderAll(); });
seg("f-cabin", "cabin", () => { saveChoice(); renderAll(); });
seg("f-dest", "dest"); seg("f-from", "from");
window.addEventListener("hashchange", () => { if (readHash()) renderAll(); });
document.getElementById("f-nonstop").addEventListener("change", e => { state.nonstop = e.target.checked; render(); });
document.getElementById("f-full").addEventListener("change", e => { state.full = e.target.checked; render(); });
document.getElementById("f-budget").addEventListener("change", e => { state.budget = e.target.checked; render(); });
renderAll();
</script>
